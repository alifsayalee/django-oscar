# Type-check gate for the payments app (run from sandbox/):
#   ../venv/Scripts/mypy --config-file apps/payments/mypy.ini apps/payments
[mypy]
strict = True
warn_unreachable = True
plugins = mypy_django_plugin.main
explicit_package_bases = True
mypy_path = .

[mypy.plugins.django-stubs]
django_settings_module = settings

[mypy-oscar.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-environ.*,sorl.*,easy_thumbnails.*,haystack.*,treebeard.*,widget_tweaks.*,django_tables2.*,phonenumber_field.*,extra_views.*,purl.*,whitenoise.*,factory.*]
ignore_missing_imports = True

[mypy-apps.payments.migrations.*]
ignore_errors = True

# The sandbox's own settings module is untyped; only this app is gated.
[mypy-settings,settings_local]
ignore_errors = True
ignore_missing_imports = True
