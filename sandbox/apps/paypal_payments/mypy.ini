# Type-check gate for the PayPal integration (the SDK ships py.typed and is
# generated under mypy --strict). Run from sandbox/:
#   ../venv/Scripts/python -m mypy --config-file apps/paypal_payments/mypy.ini apps/paypal_payments
[mypy]
strict = True
warn_unreachable = True
mypy_path = .
explicit_package_bases = True
plugins = mypy_django_plugin.main
exclude = (migrations|tests)/

[mypy.plugins.django-stubs]
django_settings_module = settings

# The sandbox's settings module is untyped, and settings_local is optional.
[mypy-settings,settings_local]
ignore_errors = True
ignore_missing_imports = True

# Oscar and the sandbox's other third-party apps ship no type information.
[mypy-oscar.*,environ.*,haystack.*,treebeard.*,sorl.*,easy_thumbnails.*,django_tables2.*,widget_tweaks.*,whitenoise.*]
ignore_missing_imports = True
follow_imports = skip
